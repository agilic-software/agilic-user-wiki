<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agilic User Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Agilic user documentation">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="docs/theme.css?v=7">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '<img src="logo.png" alt="Agilic" onerror="this.style.display=\'none\'"> Agilic Wiki',
      loadSidebar: true,
      auto2top: true,
      search: 'auto',
      plugins: [
        function (hook) {
          hook.mounted(function () {
            var link = document.createElement('div')
            link.className = 'agilic-back-link'
            link.innerHTML = '<a href="https://agilicsoftware.com/">&larr; Back to agilicsoftware.com</a>'
            var sidebar = document.querySelector('.sidebar')
            if (sidebar) {
              sidebar.insertBefore(link, sidebar.firstChild)
            }
          })
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
